version: 2
updates:
  # GitHub Actions: Monthly to reduce PR spam from CI tooling updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    pull-requests:
      max-open: 3
    commit-message:
      prefix: "ci"

  # Root go.mod: Weekly direct dependencies with smart grouping
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    allow:
      - dependency-type: direct
    groups:
      # Group OpenTelemetry packages to reduce PR noise
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      # Group Kubernetes packages for coordinated updates
      kubernetes:
        patterns:
          - "k8s.io/*"
    commit-message:
      prefix: "deps"
